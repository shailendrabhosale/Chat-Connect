spring:
  application:
    name: gateway
  lifecycle:
    # Per shutdown phase. Must stay below the orchestrator's kill deadline: compose
    # stop_grace_period (P1.C4) and k8s terminationGracePeriodSeconds (30 s default).
    timeout-per-shutdown-phase: 20s
  reactor:
    # MDC (traceId) must follow the request across Reactor/Netty threads.
    context-propagation: auto
  cloud:
    gateway:
      server:
        webflux:
          # I14 + architecture §5.1 deadline budget: browser 10 s > gateway response 5 s > internal calls.
          # No gateway retries: POST is not idempotent at the HTTP layer (I1 handles replays).
          httpclient:
            # Default 30 s. Local/compose network: a healthy connect takes well under 10 ms.
            connect-timeout: 1000
            # Default is NONE (wait forever). Time to response headers; exceeded → 504.
            response-timeout: 5s
            pool:
              # Default NONE: a pooled connection the downstream already closed (Tomcat
              # keep-alive 60 s) gets reused → "Connection prematurely closed". Stay below it.
              max-idle-time: 15s
          # Paths are forwarded unchanged: /api/{service}/v{n}/... (architecture §8), so a
          # version bump needs no gateway change. /ws joins at P4.C1 with its own timeout.
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
            - id: chat-service
              uri: ${CHAT_SERVICE_URI:http://localhost:8082}
              predicates:
                - Path=/api/chat/**
server:
  port: ${SERVER_PORT:8080}
  # Boot 3.5 default; explicit because I10 depends on it.
  shutdown: graceful

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: ${APP_ENV:local}
        # Container hostname = replica identity once services scale out.
        node-name: ${HOSTNAME:local}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Off by default outside Kubernetes. Liveness = process only; readiness gains
      # critical dependencies (DB, broker) as they arrive.
      probes:
        enabled: true
  tracing:
    # MP §6: 100% locally. No exporter until P20, so spans cost only CPU.
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      # W3C traceparent only (I10). The default also accepts B3 headers.
      type: w3c
